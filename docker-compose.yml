# Local stack: Postgres (same major as Azure Database for PostgreSQL Flexible Server) and the MCP server.
services:
  db:
    # Pinned by digest (postgres 18.7), like a lockfile for images.
    image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_USER: laburo
      POSTGRES_PASSWORD: laburo  # local only; matches .env.sample
      POSTGRES_DB: laburo
    ports:
      - "127.0.0.1:5432:5432"  # reachable from this machine only
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laburo -d laburo"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    image: laburo-match:dev
    depends_on:
      db:
        condition: service_healthy  # start only once Postgres accepts connections
    ports:
      - "127.0.0.1:8000:8000"  # reachable from this machine only (Windows hosts use localhost)
    # The real .env lives outside the repo. Compose reads it as you and injects the variables:
    # a bind mount would keep its owner and 0600 mode, which the container user cannot read.
    env_file:
      - ${ENV_FILE_PATH:?set ENV_FILE_PATH to your real .env}
    environment:
      # Inside the container `localhost` is the container itself: Postgres is reached as `db`.
      # Environment variables beat the env file, so the same .env works with `make dev`.
      DATABASE_URL: postgresql+psycopg://laburo:laburo@db:5432/laburo
      SERVER_HOST: 0.0.0.0  # the published port is bound to loopback on the host side
    healthcheck:
      # Liveness only (/health); /ready also checks the database. The slim image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
