# Runs on every pull request and on main. No secrets: tests use fakes, so a fork's PR is safe.
# Actions are pinned by commit SHA (the comment names the release); the Postgres image by digest.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # the action lists the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # scan the history, not only the last commit
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Lint, audit and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Same image as docker-compose.yml. The database is the test one from the start.
        image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_USER: laburo
          POSTGRES_PASSWORD: laburo
          POSTGRES_DB: laburo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laburo -d laburo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v10.3.3, not the newest: a release needs a couple of weeks in the open before we run it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Install exactly what the lockfile says
        run: uv sync --frozen
      - name: Lint (ruff and pyright)
        run: make lint
      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip
      - name: Tests
        run: make test
